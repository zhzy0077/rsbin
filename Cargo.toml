[package]
name = "rsbin"
version = "0.1.10"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1"
bytes = "1.11.0"
bzip2 = "0.6.1"
clap = { version = "4.5.37", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.1"
glob = "0.3.3"
regex = "1.12.2"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tar = "0.4.44"
tempfile = "3.19.1"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"
xz2 = "0.1.7"
zip = "8.6.0"
zstd = "0.13.3"

[dev-dependencies]
serde_json = "1.0.140"
